name: Android test APK
on:
  push:
    branches: [feat/android-native-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
        env:
          VITE_BASE_PATH: /
      - run: npx cap sync android
      - name: Build and test Android
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK signature and package
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Calons-1.3.5-android.1.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs apk/*.apk | tee apk/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apk/*.apk > apk/package-info.txt
          cd apk
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: calons-android-test
          path: apk/
          retention-days: 30
